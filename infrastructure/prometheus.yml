global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'prometheus-rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:

  # OTel Collector Prometheus exporter — metrics sent via OTLP
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_protocols:
      - OpenMetricsText1.0.0
      - OpenMetricsText0.0.1
      - PrometheusText0.0.4

  # OTel Collector's own internal metrics
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']

  # Experiments 01 and 02 — direct Prometheus client
  - job_name: 'direct-app'
    static_configs:
      - targets: ['host.docker.internal:8000']
    scrape_interval: 5s

  # Experiment 04 — histogram comparison (different port)
  - job_name: 'histogram-experiment'
    static_configs:
      - targets: ['host.docker.internal:8001']
    scrape_interval: 5s

  # Experiment 05 — cardinality explosion
  - job_name: 'cardinality-experiment'
    static_configs:
      - targets: ['host.docker.internal:8002']
    scrape_interval: 5s

  # Experiment 06 — multi-instance aggregation (3 instances)
  - job_name: 'multi-instance'
    static_configs:
      - targets:
          - 'host.docker.internal:8010'
          - 'host.docker.internal:8011'
          - 'host.docker.internal:8012'
    scrape_interval: 5s

  # Experiment 08 — recording rules source metrics
  - job_name: 'recording-rules-experiment'
    static_configs:
      - targets: ['host.docker.internal:8003']
    scrape_interval: 5s

  # Experiment 09 — alertmanager (shares metric names with experiment 08)
  - job_name: 'alertmanager-experiment'
    static_configs:
      - targets: ['host.docker.internal:8004']
    scrape_interval: 5s
