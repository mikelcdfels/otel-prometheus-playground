global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # OTel Collector Prometheus exporter — metrics sent via OTLP
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # OTel Collector's own internal metrics
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']

  # Experiments 01 and 02 — direct Prometheus client
  - job_name: 'direct-app'
    static_configs:
      - targets: ['host.docker.internal:8000']
    scrape_interval: 5s

  # Experiment 04 — histogram comparison (different port)
  - job_name: 'histogram-experiment'
    static_configs:
      - targets: ['host.docker.internal:8001']
    scrape_interval: 5s
