receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  # Uncomment during Experiment 03 to see the effect
  # cumulativetodelta:
  #   include:
  #     match_type: regexp
  #     metrics: [".+"]

  # Experiment 10 — OTTL: drop internal debug metrics by name
  filter/drop-debug:
    metrics:
      metric:
        - name == "internal.debug.operations"

  # Experiment 10 — OTTL: drop data points from the test environment
  filter/drop-test:
    metrics:
      datapoint:
        - attributes["environment"] == "test"

  # Experiment 10 — OTTL: rename, enrich, and scrub PII
  transform/enrich-and-clean:
    metric_statements:
      - context: metric
        statements:
          - set(name, "app.requests.total") where name == "app.legacy.counter"
      - context: datapoint
        statements:
          - set(attributes["cluster"], "eu-prod")
          - delete_key(attributes, "user.email")
          - delete_key(attributes, "user.name")
          - delete_key(attributes, "user.phone")
          - truncate_all(attributes, 256)

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "otel"              # adds otel_ prefix to all metric names
    enable_open_metrics: true   

  debug:
    verbosity: detailed            # logs every metric to stdout — useful for debugging

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop-debug, filter/drop-test, transform/enrich-and-clean, batch]
      #processors: [memory_limiter, batch]

      exporters: [prometheus, debug]

    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888        # Collector's own metrics endpoint

